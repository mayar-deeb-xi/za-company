html/custom_html_shell=""
html/head_include="<style>
/* The loading page in the menu's own colours (tools/build_ui_theme.gd: BG_DEEP,
   SURFACE, BORDER, ACCENT_WARM) around the boot splash, splash.png: the icon's
   64 px art at 4x, so 256 is its real size and 128 below an exact half. */
#status { background-color: #1b1119; }
#status-splash { width: 256px; height: 256px; image-rendering: pixelated; }
#status-progress {
	-webkit-appearance: none; appearance: none;
	top: calc(50% + 152px); bottom: auto;
	width: 256px; height: 14px; box-sizing: border-box;
	border: 2px solid #674949; background: #3a3941;
}
#status-progress::-webkit-progress-bar { background: #3a3941; }
#status-progress::-webkit-progress-value { background: #ec773d; }
#status-progress::-moz-progress-bar { background: #ec773d; }
@media (max-height: 420px) {
	#status-splash { width: 128px; height: 128px; }
	#status-progress { top: calc(50% + 88px); width: 128px; }
}
</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

