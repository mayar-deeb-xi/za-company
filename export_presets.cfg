html/custom_html_shell=""
html/head_include="<style>
/* The loading page in the menu's own colours (tools/build_ui_theme.gd: BG_DEEP,
   SURFACE, BORDER, ACCENT_WARM) around the boot splash, splash.png: the icon's
   64 px art at 4x, so 256 is its real size and 128 below an exact half. */
#status { background-color: #1b1119; }
#status-splash { width: 256px; height: 256px; image-rendering: pixelated; }
#status-progress {
	-webkit-appearance: none; appearance: none;
	top: calc(50% + 152px); bottom: auto;
	width: 256px; height: 14px; box-sizing: border-box;
	border: 2px solid #674949; background: #3a3941;
}
#status-progress::-webkit-progress-bar { background: #3a3941; }
#status-progress::-webkit-progress-value { background: #ec773d; }
#status-progress::-moz-progress-bar { background: #ec773d; }
@media (max-height: 420px) {
	#status-splash { width: 128px; height: 128px; }
	#status-progress { top: calc(50% + 88px); width: 128px; }
}
</style>
<style>
/* The menu's own font (assets/fonts/KenneyMiniSquare.ttf, CC0). The page cannot
   read it out of the pack, so it travels inside the page. */
@font-face { font-family: 'Kenney Mini Square'; src: url(data:font/ttf;base64,) format('truetype'); }
#za-readout {
	position: absolute; left: 0; right: 0; margin: 0 auto;
	top: calc(50% + 178px); width: 256px;
	display: flex; justify-content: space-between; gap: 12px;
	font: 20px/1 'Kenney Mini Square', ui-monospace, monospace;
	color: #987a68; white-space: nowrap;
}
#za-readout b { color: #fff8e1; font-weight: normal; }
@media (max-height: 420px) {
	#za-readout { top: calc(50% + 110px); width: 256px; }
}
</style>
<script>
// The loading readout under the bar: how much of the download has arrived,
// of how much, and how fast. Godot's bar counts UNPACKED bytes (fetch hands
// over the body already un-gzipped), so it cannot say either: 53.7 MB unpacks
// from a 22.9 MB download, and a speed taken from it would read 2.3x the line.
// So each game file is counted here off a clone of its response, and scaled by
// its own Content-Length (the gzipped size) against its unpacked size.
(() => {
	const files = {};
	const realFetch = window.fetch;
	window.fetch = function (input) {
		const sizes = typeof GODOT_CONFIG !== 'undefined' ? GODOT_CONFIG.fileSizes : {};
		const name = String(input && input.url || input).split('/').pop().split('?')[0];
		const p = realFetch.apply(this, arguments);
		if (!(name in sizes)) {
			return p;
		}
		return p.then((response) => {
			const sent = parseInt(response.headers.get('Content-Length'), 10);
			const f = files[name] = { unpacked: sizes[name], wire: sent > 0 ? sent : sizes[name], got: 0 };
			if (response.ok && response.body) {
				const reader = response.clone().body.getReader();
				const pump = () => reader.read().then(({ done, value }) => {
					if (!done) {
						f.got += value.length;
						pump();
					}
				});
				pump();
			}
			return response;
		});
	};

	const mb = (n) => (n / 1e6).toFixed(1);
	const history = [];
	addEventListener('DOMContentLoaded', () => {
		const status = document.getElementById('status');
		const bar = document.getElementById('status-progress');
		const out = document.createElement('div');
		out.id = 'za-readout';
		status.appendChild(out);
		const tick = setInterval(() => {
			if (!document.getElementById('status')) {
				// The engine is up and the page is gone: stop, and give the game
				// back a fetch nobody is listening to.
				clearInterval(tick);
				window.fetch = realFetch;
				return;
			}
			// Only while the bar is up: not before it, and not over an error notice.
			out.style.visibility = bar.style.display === 'block' ? '' : 'hidden';
			const list = Object.values(files);
			if (list.length === 0) {
				out.textContent = '';
				return;
			}
			let got = 0, total = 0, done = true;
			for (const f of list) {
				got += Math.min(f.got, f.unpacked) * f.wire / f.unpacked;
				total += f.wire;
				done = done && f.got >= f.unpacked;
			}
			const now = performance.now();
			history.push([now, got]);
			while (history.length > 1 && now - history[0][0] > 2000) {
				history.shift();
			}
			const [t0, g0] = history[0];
			const speed = now - t0 > 400 ? (got - g0) / ((now - t0) / 1000) : 0;
			const size = '<b>' + mb(got) + '</b> / ' + mb(total) + ' MB';
			const rate = done ? 'STARTING' : speed > 0 ? '<b>' + mb(speed) + '</b> MB/s' : '';
			out.innerHTML = '<span>' + size + '</span><span>' + rate + '</span>';
		}, 250);
	});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

