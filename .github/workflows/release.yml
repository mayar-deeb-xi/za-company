# A release is a change to VERSION reaching main, and nothing else is.
#
# Pushing and merging into main is ordinary work and publishes nothing. The day
# VERSION changes on main, this builds the game for Windows (an installer and a
# portable zip) and macOS (a disk image), tags the commit v<VERSION> and
# publishes a GitHub Release carrying all three, with every commit since the
# last release as its notes. Nothing is published unless every build worked -
# and that includes the web build and the server's checks, which are not on
# the Release page but go out with it: once the Release exists, the deploy job
# brings the server's stack up to this commit and puts the web build live at
# https://za-company.mayar-deeb.dev. The site is always the latest release.
#
# On develop it is a DRY RUN: a push there that touches what the builds are
# made of (the presets, this file, tools/release/) builds everything and keeps
# the files on the run's page for a week, and publishes nothing. That is how a
# packaging change is tried without spending a version number on it.
#
# The rest of the flow (develop -> main, bumping the number) is RELEASING.md.

name: Release

on:
  push:
    branches: [main, develop]
    paths:
      - VERSION
      - export_presets.cfg
      - .github/workflows/release.yml
      - tools/release/**
  # Re-run by hand from the Actions tab: on main it releases if VERSION is not
  # out yet (and stops at "already released" if it is); anywhere else it is a
  # dry run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      core: ${{ steps.plan.outputs.core }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every tag, for the checks below

      - name: Read VERSION and decide what this run is
        id: plan
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not MAJOR.MINOR.PATCH (optionally -suffix, e.g. 1.2.0-beta.1)"
            exit 1
          fi
          tag="v$version"
          core="${version%%-*}"
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          {
            echo "version=$version"
            echo "core=$core"
            echo "tag=$tag"
            echo "previous=$latest"
            [[ "$version" == *-* ]] && echo "prerelease=true" || echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Dry run on ${GITHUB_REF#refs/heads/}: building $version, publishing nothing"
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already released - nothing to do"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A lower number than one already out is a typo, not a release.
          # Compared on MAJOR.MINOR.PATCH alone: sort -V ranks 1.0.0 BELOW
          # 1.0.0-rc.1, which is backwards for releasing 1.0.0 after its rc.
          if [ -n "$latest" ]; then
            core_old="${latest#v}"; core_old="${core_old%%-*}"
            top="$(printf '%s\n%s\n' "$core_old" "$core" | sort -V | tail -n1)"
            if [ "$core" != "$core_old" ] && [ "$top" != "$core" ]; then
              echo "::error file=VERSION::$version is lower than the latest release $latest"
              exit 1
            fi
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CORE: ${{ needs.plan.outputs.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-windows-v1

      - name: Fetch Godot and the Windows template
        run: echo "GODOT=$(bash tools/release/fetch_godot.sh windows ~/godot-cache)" >> "$GITHUB_ENV"

      - name: Stamp the version and import
        run: bash tools/release/prepare.sh "$GODOT" "$CORE"

      - name: Export
        run: bash tools/release/export.sh "$GODOT" "Windows Desktop" build/windows/TheNewHire.exe

      - name: Licences beside the binaries
        # The WebRTC library ships next to the exe, so its licences do too
        # (CREDITS.md). They are also inside the game's data on both platforms.
        run: |
          mkdir -p build/windows/licenses
          cp addons/webrtc_native/LICENSE.* build/windows/licenses/

      - name: Portable zip
        run: |
          mkdir -p dist "stage/The New Hire"
          cp -R build/windows/. "stage/The New Hire/"
          (cd stage && 7z a -tzip "../dist/TheNewHire-${VERSION}-windows-portable.zip" "The New Hire" >/dev/null)

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DFileVersion=$env:CORE" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\build\windows" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" tools\release\installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Inno Setup failed ($LASTEXITCODE)"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  macos:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CORE: ${{ needs.plan.outputs.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-v1

      - name: Fetch Godot and the macOS template
        run: echo "GODOT=$(bash tools/release/fetch_godot.sh macos ~/godot-cache)" >> "$GITHUB_ENV"

      - name: Stamp the version and import
        run: bash tools/release/prepare.sh "$GODOT" "$CORE"

      - name: Export the disk image
        run: |
          bash tools/release/export.sh "$GODOT" "macOS" build/macos/TheNewHire.dmg
          mkdir -p dist
          cp build/macos/TheNewHire.dmg "dist/TheNewHire-${VERSION}-macos.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  # The browser build. Not attached to the Release: the deploy job puts it on
  # the server, which is the only place anybody plays it.
  web:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE: ${{ needs.plan.outputs.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Fetch Godot and the web template
        run: echo "GODOT=$(bash tools/release/fetch_godot.sh web ~/godot-cache)" >> "$GITHUB_ENV"

      - name: Stamp the version and import
        run: bash tools/release/prepare.sh "$GODOT" "$CORE"

      - name: Export
        run: bash tools/release/export.sh "$GODOT" "Web" build/web/index.html

      - name: Compress
        # The server sends the .gz files as they are (Caddy's `precompressed
        # gzip`) and compresses nothing itself: one core cannot afford a second
        # of CPU per player. 54 MB of build is about 23 MB on the wire.
        run: |
          gzip -9 -k -n build/web/*.html build/web/*.js build/web/*.wasm build/web/*.pck
          ls -la build/web

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  # The server's half of the release: its tests and its compose file, checked
  # here so a broken signaling service stops a release like a failed export.
  server:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Test the signaling service
        working-directory: server/signaling
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt
          /tmp/venv/bin/python -m unittest -v test_signaling

      - name: Check the compose file
        # Against a stand-in .env: the real one, with the TURN secret, only
        # ever lives on the server.
        working-directory: server
        run: |
          sed 's/^TURN_SECRET=.*/TURN_SECRET=ci-only/' .env.example > .env
          docker compose --profile tls config --quiet
          rm .env

      - name: Bundle
        run: |
          mkdir -p dist
          tar -C server --exclude=./.env --exclude=./web --exclude=__pycache__ -cf dist/server.tar .
          tar -tf dist/server.tar

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist/server.tar
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  publish:
    needs: [plan, windows, macos, web, server]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # By name, not all of them: the web build and the server bundle are
      # this run's artifacts too, and are deployed rather than attached.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Write release notes
        run: |
          {
            echo "## Download"
            echo
            echo "- **Windows**: \`TheNewHire-*-windows-setup.exe\` installs it (or take the portable \`.zip\`)."
            echo "  Windows may say *Windows protected your PC* - click **More info**, then **Run anyway**."
            echo "- **macOS**: open \`TheNewHire-*-macos.dmg\` and drag the game to Applications."
            echo "  The first time, macOS will refuse to open it: go to **System Settings -> Privacy & Security** and click **Open Anyway**."
            echo
            echo "Third-party components, their licences and where their source is: [CREDITS.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CREDITS.md)."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since $PREVIOUS"
              echo
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..HEAD"
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/$PREVIOUS...$TAG"
            else
              echo "## First release"
              echo
              echo "$(git rev-list --count HEAD) commits of history up to this point."
            fi
          } > notes.md
          cat notes.md
          ls -la dist

      - name: Publish the release
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file notes.md "${flags[@]}"

  # Only after the Release exists, so the site never runs a version nobody can
  # download. Its key can do nothing on the server but run server/deploy.sh,
  # which takes `server` or `web` and a tar on stdin (server/README.md). If
  # this job fails the Release is still out: fix the cause and re-run the job.
  deploy:
    needs: [plan, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://za-company.mayar-deeb.dev
    env:
      HOST: za-company.mayar-deeb.dev
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web

      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server-bundle

      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::The DEPLOY_SSH_KEY secret is not set, so the Release is out but the server was not updated. RELEASING.md, Deploying, says how to add it; then re-run this job."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # The host key is pinned in the repository, never learned on the
          # day: a deploy must refuse a server that is not ours.
          cp tools/release/known_hosts ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes root@$HOST" >> "$GITHUB_ENV"

      - name: The server first
        # Signaling and the game change together (a PROTOCOL bump is both), so
        # the new game must never meet the old server.
        run: $SSH server < server-bundle/server.tar

      - name: Then the game
        run: tar -C web -cf - . | $SSH web

      - name: Check it is live
        run: |
          curl -fsS --retry 5 --retry-delay 3 "https://$HOST/healthz"
          curl -fsS "https://$HOST/" -o live.html
          cmp live.html web/index.html
          echo "::notice::v$VERSION is live at https://$HOST"
